<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f3b57"/>
      <stop offset="1" stop-color="#0e1a27"/>
    </linearGradient>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="none" stroke="#3d6d94" stroke-width="8"/>
  <!-- barras de alimentación -->
  <rect x="190" y="230" width="28" height="560" rx="10" fill="#9fb8cc"/>
  <rect x="806" y="230" width="28" height="560" rx="10" fill="#9fb8cc"/>
  <!-- segmento 1: contacto NA y bobina (con corriente) -->
  <g stroke="#3ddc84" stroke-width="26" stroke-linecap="round" fill="none">
    <line x1="218" y1="400" x2="350" y2="400"/>
    <line x1="350" y1="330" x2="350" y2="470"/>
    <line x1="430" y1="330" x2="430" y2="470"/>
    <line x1="430" y1="400" x2="580" y2="400"/>
    <path d="M610 330 Q560 400 610 470"/>
    <path d="M690 330 Q740 400 690 470"/>
    <line x1="720" y1="400" x2="806" y2="400"/>
  </g>
  <!-- segmento 2: contacto NC (sin corriente) -->
  <g stroke="#5aa0e6" stroke-width="22" stroke-linecap="round" fill="none" stroke-dasharray="1 0">
    <line x1="218" y1="640" x2="350" y2="640"/>
    <line x1="350" y1="575" x2="350" y2="705"/>
    <line x1="430" y1="575" x2="430" y2="705"/>
    <line x1="350" y1="700" x2="430" y2="580"/>
  </g>
  <g stroke="#5aa0e6" stroke-width="22" stroke-linecap="round" fill="none" stroke-dasharray="40 34">
    <line x1="460" y1="640" x2="806" y2="640"/>
  </g>
  <text x="512" y="200" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="96" fill="#e8f1f8" letter-spacing="6">PLC</text>
</svg>
